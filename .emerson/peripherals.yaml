# Dual-chamber pacemaker. All the parts share one simulated patient, which
# sits at the root of the device tree, beside /MEM rather than on it. The
# board's off-chip parts that are on no bus -- the pacing switches, the
# output stage, the Hall switch and the cell -- appear under /board; the SPI
# parts stay under their controllers. See README.md for the full board
# wiring.

# The patient: every physics model the board senses and paces, declared by
# name -- the model builds none it is not given here.
#
# The simulated heart (/patient/heart): sinus rhythm, AV conduction, capture
# and both leads. The front end senses its electrograms, the output stage
# paces it, the polarity switch rewires its ventricular lead.
#
# The patient's body (/patient/body): activity and posture. It feels to the
# ADXL362 like a chest, and its demand raises the heart's sinus rate.
#
# The clinician's magnet over the chest (/patient/magnet), the field the
# DRV5032 senses and the wand's magnet adds to.
/patient:
  - name: heart
    native: heart
  - name: body
    native: body
  - name: magnet
    native: magnet

# SPI0 (SCK=GP18, MOSI=GP19, MISO=GP16) is shared by two parts, each on its
# own plain-GPIO chip-select.
#
# TI ADS1292R sensing front end. DRDY is the part's active-low data-ready
# output, driven back into GP20. CH1 = ventricular lead, CH2 = atrial lead.
#
# Analog Devices ADXL362 accelerometer, the rate-response activity sensor. It
# feels the patient /patient/body simulates (`set_activity`, `set_posture`).
# INT1 (GP27) is programmed as the FIFO watermark.
/MEM/spi0:
  - name: ads1292r
    native: ads1292r
    cs_pin: 17
    busy_pin: 20
  - name: adxl362
    native: adxl362
    cs_pin: 22
    busy_pin: 27

# Microchip MCP4822 dual DAC on SPI1 (SCK=GP10, MOSI=GP11), LDAC tied low.
# VOUTA charges the ventricular output capacitor, VOUTB the atrial one.
#
# TI RF430CL330H dynamic NFC tag beside it (MISO=GP12), the telemetry head.
# INTO (GP3) is driven active low. A clinic programmer's wand reads and
# writes it: `emctl action /patient/wand place_wand` holds the wand over the
# implant -- its magnet and its reader -- and the programmer then talks on the
# `wand` broker (programmer/pacemaker_programmer.py does both).
# `remove_wand` lifts it, which ends the session.
#
# Microsemi ZL70102 implant radio (the MICS-band transceiver with the 2.45 GHz
# wake-up receiver wandless "ZIP" telemetry uses), third part on SPI1: CS GP5,
# IRQ GP6 (the PL022 target "busy" line, active high), WU_EN GP7 (below, under
# /MEM/sio). Its VSUP comes from the cell through a load switch whose ON pin is
# GP25 (below), so it is unpowered until firmware drives GP25 high, and again
# whenever the MCU is in reset. The air side is the bedside communicator,
# `/patient/communicator`, with the host byte broker `communicator`. The
# register map is the model's own (the ZL70102 Design Manual is not public):
# see crates/emerson-collections/zl70102.
/MEM/spi1:
  - name: mcp4822
    native: mcp4822
    cs_pin: 13
    # The output stage amplifies the DAC 1.25x so the capacitor can reach
    # Safety Mode's 5.0 V (BSC ACCOLADE physician letter, Sept 2025, Appendix A /
    # Table 3): capacitor volts = 1.25 mV x code at GA = 0 (4000 = 5.000 V).
    # The firmware converts every programmed mV to a code (dac_code_for_mv).
    output_gain: 1.25
  - name: rf430cl330h
    native: rf430cl330h
    cs_pin: 2
    busy_pin: 3
  - name: radio
    native: zl70102
    cs_pin: 5
    busy_pin: 6

# The implant's lithium/carbon-monofluoride primary cell (/board/battery): the
# ACCOLADE's chemistry (BSC spec sheet "lithium-carbon monofluoride cell"; 1.6
# Ah, 47 uF on the rail; crates/emerson-collections/implant_cell). It is the
# board's supply rail: it powers the pacing output stage, so every pace drains
# it, and the radio and the supervisor draw from it and watch it. VBAT goes
# straight to GP26 (ADC0, /MEM/adc/vbat below), where firmware watches its
# loaded voltage for ERI (2.55 V) and EOL (2.30 V). A real cell lasts about
# 14 years: at x1e6 aging one guest second is 11.6 days, and the cell reaches
# ERI about seven guest minutes in. `emctl action /board/battery set_depletion
# 97` skips most of the way; `set_defect 1` adds the ACCOLADE high-impedance
# defect, and `set_draw radio 6000` loads the rail with 6 mA. Other
# `chemistry:` values: li_mno2, and li_iodine (the default when the key is
# absent, the original 2.8 V Li/I2).
#
# The pacing output stage (/board/output_stage): the two output capacitors
# the MCP4822 charges (through `output_gain`) and the TS5A3166 switches below
# discharge into the heart's leads, its charge pump fed from the cell.
/board:
  - name: battery
    native: implant_cell
    chemistry: li_cfx
    aging_factor: 1.0e+6
  - name: output_stage
    native: pacing_output

# TI TS5A3166 SPST switches between each output capacitor and its lead:
# ventricular IN on GP14, atrial IN on GP15. Firmware holds IN high for the
# pulse width.
/MEM/sio:
  - name: vpace
    native: ts5a3166
    chamber: ventricle
    pins:
      in: 14
  - name: apace
    native: ts5a3166
    chamber: atrium
    pins:
      in: 15

# TI TS5A3159 SPDT switch (SCDS174D): the ventricular lead's polarity. COM is
# the sense amplifier's and the pacing output's return; NC is the lead's ring,
# NO is the can. IN (GP28) low = ring = bipolar, high = can = unipolar. Firmware
# that never touches GP28 stays bipolar. /board/polarity.
  - name: polarity
    native: ts5a3159
    chamber: ventricle
    pins:
      in: 28

# TI TPS22860 ultra-low-leakage load switch (SLVSD04) between the cell and the
# ZL70102's VSUP: ON on GP25, pulled down on the board, so the radio is off in
# reset. tON/tOFF are nanoseconds; the switch itself draws 10-12 nA from the
# cell. /board/radio_vsup.
  - name: radio_vsup
    native: tps22860
    pins:
      on: 25

# The GPIO wire to the ZL70102's WU_EN pin: GP7. A pulse under 1.5 ms strobes
# the 2.45 GHz wake-up receiver, a longer one starts the core (DS "Startup
# Method Using IMD Pin Control"). /board/radio_wu_en.
  - name: radio_wu_en
    native: zl70102_wu_en
    pins:
      wu_en: 7

# TI DRV5032FA omnipolar Hall switch (push-pull OUT -> GP21, low with a
# magnet over it): the clinician's magnet forces asynchronous pacing. The
# part is /board/magnet_sensor; the magnet is /patient/magnet.
  - name: magnet_sensor
    native: drv5032
    pins:
      out: 21

# VBAT, the cell's rail (/board/battery above), straight to GP26 (ADC0) with
# no divider: only the wire. Its `vin` is bound to the cell's `rail` under
# `signals:` below.
/MEM/adc:
  - name: vbat
    channel: 0
    native: battery_monitor

# Microchip AT24C256C 32 KB serial EEPROM on I2C0 (SDA GP8, SCL GP9), A2-A0
# strapped low: the diagnostic store. Counters, histograms, the episode log,
# trends and stored EGMs are checkpointed here, so they survive a reset, and
# a telemetry session through the wand or the radio reads them back
# (programmer/pacemaker_programmer.py). `emctl action /MEM/i2c0/at24c256 dump
# 0` shows the raw store; it starts with the "PMDS" magic.
/MEM/i2c0:
  - name: at24c256
    address: 0x50
    native: at24c256

# TI TPS3839G25 supply supervisor on the RUN pin: RESET (push-pull, active
# low) goes low when the implant's rail falls below 2.325 V (+23 mV
# hysteresis) and stays low for 200 ms after it recovers, holding the chip in
# reset (POWMAN.CHIP_RESET.HAD_RUN_LOW). It is /board/supervisor.
#
# It watches the implant cell's instantaneous rail (`board_supply_rail`).
# The RP2350's own regulator needs VREG_VIN >= 2.7 V, above a Li/CFx cell's
# plateau, so this board feeds DVDD from an external low-Iq regulator and
# runs IOVDD straight off the cell (>= 1.62 V); neither is modelled.
/MEM/run:
  - name: supervisor
    native: tps3839
    variant: G25

# Every analog connection between the parts above and the patient, by
# device-tree path: each is a continuous quantity one part reads from another
# at the instant it samples (docs/signals.md). This is the whole list -- with
# it present the model binds nothing on its own. `emctl connections` shows
# them live, and `emctl signal <path> <name>` reads a source now. What stays
# wired in the model, because it is an event rather than a level: pacing
# switches closing, the polarity switch rewiring a lead, each pulse's cost
# going back to the cell, the body telling the heart its demand.
signals:
  # The ventricular lead's electrogram (V) into the ADS1292R's CH1, and its
  # impedance (ohm; infinite while open) into CH1's lead-off detection.
  - { source: /patient/heart, source_signal: ventricle_egm, input: /MEM/spi0/ads1292r, input_signal: in1 }
  - { source: /patient/heart, source_signal: ventricle_impedance,
      input: /MEM/spi0/ads1292r, input_signal: in1_impedance }
  # The atrial lead's, into CH2.
  - { source: /patient/heart, source_signal: atrium_egm, input: /MEM/spi0/ads1292r, input_signal: in2 }
  - { source: /patient/heart, source_signal: atrium_impedance,
      input: /MEM/spi0/ads1292r, input_signal: in2_impedance }
  # The DAC's outputs (V) charge the output capacitors: VOUTA the ventricular
  # one, VOUTB the atrial one.
  - { source: /MEM/spi1/mcp4822, source_signal: vout_a, input: /board/output_stage, input_signal: ventricle_dac }
  - { source: /MEM/spi1/mcp4822, source_signal: vout_b, input: /board/output_stage, input_signal: atrium_dac }
  # The cell's loaded rail (V) into ADC0, and its output rail (V), the charge
  # pump's limit on a pulse, into the output stage.
  - { source: /board/battery, source_signal: rail, input: /MEM/adc/vbat, input_signal: vin }
  - { source: /board/battery, source_signal: output_rail, input: /board/output_stage, input_signal: output_rail }
  # The clinician's magnet (or the wand's) over the chest (mT) at the Hall switch.
  - { source: /patient/magnet, source_signal: field, input: /board/magnet_sensor, input_signal: field }
